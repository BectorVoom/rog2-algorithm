[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rog2-pf"
version = "0.1.0"
description = "GPU particle filter (CubeCL/CUDA) for the ROGII wellbore geology competition"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "BectorVoom" },
]
keywords = ["particle-filter", "gpu", "cuda", "cubecl", "geology", "wellbore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/BectorVoom/rog2-algorithm"
Repository = "https://github.com/BectorVoom/rog2-algorithm"

[tool.maturin]
features = ["pyo3/extension-module", "python", "cuda"]
module-name = "rog2_pf._rog2_pf"
python-source = "python"
strip = true
