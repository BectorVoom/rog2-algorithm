name: Publish rog2-algorithm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      features:
        description: 'Comma-separated maturin feature flags (e.g. cpu, cuda, hip)'
        required: false
        default: 'cpu'
        type: string

env:
  MATURIN_FEATURES: 'pyo3/extension-module,python'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: latest
          command: build
          args: >
            --release --no-default-features
            --features '${{ env.MATURIN_FEATURES }},${{ inputs.features || 'cpu' }}'
            -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  test-pypi-publish:
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
